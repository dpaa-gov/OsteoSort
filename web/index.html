<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OsteoSort</title>
    <link rel="stylesheet" href="vendor/bootstrap-flatly.min.css">
    <link rel="stylesheet" href="vendor/tom-select.bootstrap5.min.css">
    <link rel="stylesheet" href="css/osteosort.css">
</head>
<body>
    <nav class="navbar navbar-expand app-navbar">
        <div class="container-fluid">
            <span class="navbar-brand"><img src="img/osteosort.png" class="navbar-logo" alt="OsteoSort"></span>
            <ul class="navbar-nav" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="nav-single" data-bs-toggle="tab" data-bs-target="#tab-single" type="button" role="tab">
                        <i class="os-icon icon-bone"></i> Single
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="nav-multiple" data-bs-toggle="tab" data-bs-target="#tab-multiple" type="button" role="tab">
                        <i class="os-icon icon-table-list"></i> Multiple
                    </button>
                </li>
                <li class="nav-item dropdown">
                    <button class="nav-link dropdown-toggle" data-bs-toggle="dropdown" type="button" aria-expanded="false">
                        <i class="os-icon icon-folder-open"></i> Files
                    </button>
                    <div class="dropdown-menu files-menu">
                        <a class="btn btn-gold" href="api/template.csv" download="template.csv">Template</a>
                        <a class="btn btn-gold" href="files/example_data.csv" download>Example</a>
                    </div>
                </li>
            </ul>
            <span class="version-badge ms-auto" id="version"></span>
        </div>
    </nav>

    <main class="container-fluid app-main">
        <div class="alert alert-danger" id="load-error" hidden></div>
        <!-- shown by app.js once the dropdowns are built -->
        <div class="tab-content" id="app-content" hidden>

            <!-- Single -->
            <div class="tab-pane show active" id="tab-single" role="tabpanel">
                <div class="app-layout">
                    <div class="app-sidebar">
                        <form class="well" id="s-form" autocomplete="off">
                            <div class="sidebar-section-label">Reference</div>
                            <select id="s-reference" multiple placeholder="Select reference group(s)..."></select>
                            <div class="sidebar-section-label">Analysis</div>
                            <div class="btn-group segmented analysis-group w-100" role="group" aria-label="Analysis" id="s-analysis">
                                <input type="radio" class="btn-check" name="s-analysis" id="s-analysis-pairmatch" value="pairmatch" checked><label class="btn" for="s-analysis-pairmatch">Pair-match</label>
                                <input type="radio" class="btn-check" name="s-analysis" id="s-analysis-articulation" value="articulation"><label class="btn" for="s-analysis-articulation">Articulation</label>
                                <input type="radio" class="btn-check" name="s-analysis" id="s-analysis-regression" value="regression"><label class="btn" for="s-analysis-regression">Regression</label>
                            </div>

                            <div data-analysis="pairmatch">
                                <div class="sidebar-section-label">Element</div>
                                <select id="s-element" aria-label="Element"></select>
                                <div class="sidebar-section-label">Measurements</div>
                                <div class="measure-scroll"><div class="measure-list for-a-pair" id="s-sides"></div></div>
                            </div>

                            <div data-analysis="regression" hidden>
                                <div class="sidebar-section-label">Element</div>
                                <div class="row gx-3 predicts">
                                    <span class="predicts-arrow" data-tooltip="Predicts">&rarr;</span>
                                    <div class="col-6">
                                        <select id="s-element-a" aria-label="Independent element"></select>
                                        <div class="stacked"><div class="btn-group segmented side-group w-100" role="group" aria-label="Independent side" id="s-side-a"><input type="radio" class="btn-check" name="s-side-a" id="s-side-a-left" value="Left" checked><label class="btn" for="s-side-a-left">Left</label><input type="radio" class="btn-check" name="s-side-a" id="s-side-a-right" value="Right"><label class="btn" for="s-side-a-right">Right</label></div></div>
                                    </div>
                                    <div class="col-6">
                                        <select id="s-element-b" aria-label="Dependent element"></select>
                                        <div class="stacked"><div class="btn-group segmented side-group w-100" role="group" aria-label="Dependent side" id="s-side-b"><input type="radio" class="btn-check" name="s-side-b" id="s-side-b-left" value="Left" checked><label class="btn" for="s-side-b-left">Left</label><input type="radio" class="btn-check" name="s-side-b" id="s-side-b-right" value="Right"><label class="btn" for="s-side-b-right">Right</label></div></div>
                                    </div>
                                </div>
                                <div class="sidebar-section-label">Measurements</div>
                                <div class="measure-scroll">
                                    <div class="row gx-3">
                                        <div class="col-6"><div class="measure-list" id="s-values-a"></div></div>
                                        <div class="col-6"><div class="measure-list" id="s-values-b"></div></div>
                                    </div>
                                </div>
                            </div>

                            <div data-analysis="articulation" hidden>
                                <div class="sidebar-section-label">Element</div>
                                <div class="row gx-3">
                                    <div class="col-6"><select id="s-pair" aria-label="Elements"></select></div>
                                    <div class="col-6"><div class="btn-group segmented side-group w-100" role="group" aria-label="Side" id="s-art-side"><input type="radio" class="btn-check" name="s-art-side" id="s-art-side-left" value="Left" checked><label class="btn" for="s-art-side-left">Left</label><input type="radio" class="btn-check" name="s-art-side" id="s-art-side-right" value="Right"><label class="btn" for="s-art-side-right">Right</label></div></div>
                                </div>
                                <div class="sidebar-section-label">Measurements</div>
                                <div class="row gx-3">
                                    <div class="col-6"><div class="measure-list" id="s-art-a"></div></div>
                                    <div class="col-6"><div class="measure-list" id="s-art-b"></div></div>
                                </div>
                            </div>

                            <!-- folded away until asked for; what is set shows beside the heading -->
                            <button class="sidebar-section-label settings-toggle collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#s-settings" aria-expanded="false" aria-controls="s-settings">
                                <span>Settings</span><span class="settings-summary" id="s-settings-summary"></span>
                            </button>
                            <div class="collapse" id="s-settings">
                            <div class="btn-group segmented tails-group w-100" role="group" aria-label="Tails">
                                <input type="radio" class="btn-check" name="s-tails" id="s-tails-1" value="1"><label class="btn" for="s-tails-1">One-tailed</label>
                                <input type="radio" class="btn-check" name="s-tails" id="s-tails-2" value="2" checked><label class="btn" for="s-tails-2">Two-tailed</label>
                            </div>
                            <div class="btn-group segmented alpha-group w-100" role="group" aria-label="Alpha">
                                <input type="radio" class="btn-check" name="s-alpha" id="s-alpha-001" value="0.01"><label class="btn" for="s-alpha-001">&alpha; 0.01</label>
                                <input type="radio" class="btn-check" name="s-alpha" id="s-alpha-005" value="0.05"><label class="btn" for="s-alpha-005">&alpha; 0.05</label>
                                <input type="radio" class="btn-check" name="s-alpha" id="s-alpha-01" value="0.1" checked><label class="btn" for="s-alpha-01">&alpha; 0.1</label>
                            </div>
                            <div class="ttest-settings">
                                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="s-absolute"><label class="form-check-label" for="s-absolute">Absolute differences</label></div>
                                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="s-yeojohnson"><label class="form-check-label" for="s-yeojohnson">Yeo-Johnson transformation</label></div>
                                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="s-zeromean"><label class="form-check-label" for="s-zeromean">Zero mean</label></div>
                                <div class="settings-notes" id="s-notes"></div>
                            </div>
                            </div>
                            <hr>
                            <div class="row gx-3">
                                <div class="col-6"><button class="btn btn-gold w-100" type="submit" id="s-process"><i class="os-icon icon-play"></i> Analyze</button></div>
                                <div class="col-6"><button class="btn btn-outline-gold w-100" type="button" id="s-clear"><i class="os-icon icon-eraser"></i> Clear</button></div>
                            </div>
                        </form>
                    </div>
                    <div class="app-results">
                        <div id="s-results" hidden>
                            <div class="panel">
                                <div class="main-section-label">Summary</div>
                                <div class="summary-row">
                                    <div class="stat-tiles in-a-row" id="s-summary"></div>
                                    <div id="s-plot" class="plot-single" data-filename="osteosort-comparison"></div>
                                </div>
                            </div>
                            <div class="panel">
                                <div class="main-section-label">Results</div>
                                <div class="table-toolbar">
                                    <button class="btn btn-gold btn-sm" type="button" id="s-copy"><i class="os-icon icon-copy"></i> <span>Copy</span></button>
                                </div>
                                <div class="table-responsive"><table class="table table-striped table-bordered table-hover" id="s-table"></table></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Multiple -->
            <div class="tab-pane" id="tab-multiple" role="tabpanel">
                <div class="app-layout">
                    <div class="app-sidebar">
                        <form class="well" id="m-form" autocomplete="off">
                            <div class="sidebar-section-label">Reference</div>
                            <select id="m-reference" multiple placeholder="Select reference group(s)..."></select>
                            <div class="sidebar-section-label">Upload</div>
                            <input class="form-control" type="file" id="m-file" accept=".csv,text/csv,text/plain">
                            <div class="upload-summary" id="m-upload-summary" hidden></div>
                            <div class="sidebar-section-label">Analysis</div>
                            <div class="btn-group segmented analysis-group w-100" role="group" aria-label="Analysis" id="m-analysis">
                                <input type="radio" class="btn-check" name="m-analysis" id="m-analysis-pairmatch" value="pairmatch" checked><label class="btn" for="m-analysis-pairmatch">Pair-match</label>
                                <input type="radio" class="btn-check" name="m-analysis" id="m-analysis-articulation" value="articulation"><label class="btn" for="m-analysis-articulation">Articulation</label>
                                <input type="radio" class="btn-check" name="m-analysis" id="m-analysis-regression" value="regression"><label class="btn" for="m-analysis-regression">Regression</label>
                            </div>

                            <div data-analysis="pairmatch">
                                <div class="sidebar-section-label">Element</div>
                                <select id="m-element" aria-label="Element"></select>
                                <div class="sidebar-section-label">Measurements</div>
                                <select id="m-measurements" class="tag-grid" multiple aria-label="Measurements"></select>
                            </div>

                            <div data-analysis="articulation" hidden>
                                <div class="sidebar-section-label">Element</div>
                                <div class="row gx-3">
                                    <div class="col-6"><select id="m-pair" aria-label="Elements"></select></div>
                                    <div class="col-6"><div class="btn-group segmented side-group w-100" role="group" aria-label="Side" id="m-art-side"><input type="radio" class="btn-check" name="m-art-side" id="m-art-side-left" value="Left" checked><label class="btn" for="m-art-side-left">Left</label><input type="radio" class="btn-check" name="m-art-side" id="m-art-side-right" value="Right"><label class="btn" for="m-art-side-right">Right</label></div></div>
                                </div>
                                <div class="sidebar-section-label">Measurements</div>
                                <div class="measure-given" id="m-art"></div>
                            </div>

                            <div data-analysis="regression" hidden>
                                <div class="sidebar-section-label">Element</div>
                                <div class="row gx-3 predicts">
                                    <span class="predicts-arrow" data-tooltip="Predicts">&rarr;</span>
                                    <div class="col-6">
                                        <select id="m-element-a" aria-label="Independent element"></select>
                                        <div class="stacked"><div class="btn-group segmented side-group w-100" role="group" aria-label="Independent side" id="m-side-a"><input type="radio" class="btn-check" name="m-side-a" id="m-side-a-left" value="Left" checked><label class="btn" for="m-side-a-left">Left</label><input type="radio" class="btn-check" name="m-side-a" id="m-side-a-right" value="Right"><label class="btn" for="m-side-a-right">Right</label></div></div>
                                    </div>
                                    <div class="col-6">
                                        <select id="m-element-b" aria-label="Dependent element"></select>
                                        <div class="stacked"><div class="btn-group segmented side-group w-100" role="group" aria-label="Dependent side" id="m-side-b"><input type="radio" class="btn-check" name="m-side-b" id="m-side-b-left" value="Left" checked><label class="btn" for="m-side-b-left">Left</label><input type="radio" class="btn-check" name="m-side-b" id="m-side-b-right" value="Right"><label class="btn" for="m-side-b-right">Right</label></div></div>
                                    </div>
                                </div>
                                <div class="sidebar-section-label">Measurements</div>
                                <div class="row gx-3">
                                    <div class="col-6"><select id="m-measurements-a" class="tag-grid half" multiple></select></div>
                                    <div class="col-6"><select id="m-measurements-b" class="tag-grid half" multiple></select></div>
                                </div>
                            </div>

                            <!-- folded away until asked for; what is set shows beside the heading -->
                            <button class="sidebar-section-label settings-toggle collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#m-settings" aria-expanded="false" aria-controls="m-settings">
                                <span>Settings</span><span class="settings-summary" id="m-settings-summary"></span>
                            </button>
                            <div class="collapse" id="m-settings">
                            <div class="btn-group segmented tails-group w-100" role="group" aria-label="Tails">
                                <input type="radio" class="btn-check" name="m-tails" id="m-tails-1" value="1"><label class="btn" for="m-tails-1">One-tailed</label>
                                <input type="radio" class="btn-check" name="m-tails" id="m-tails-2" value="2" checked><label class="btn" for="m-tails-2">Two-tailed</label>
                            </div>
                            <div class="btn-group segmented alpha-group w-100" role="group" aria-label="Alpha">
                                <input type="radio" class="btn-check" name="m-alpha" id="m-alpha-001" value="0.01"><label class="btn" for="m-alpha-001">&alpha; 0.01</label>
                                <input type="radio" class="btn-check" name="m-alpha" id="m-alpha-005" value="0.05"><label class="btn" for="m-alpha-005">&alpha; 0.05</label>
                                <input type="radio" class="btn-check" name="m-alpha" id="m-alpha-01" value="0.1" checked><label class="btn" for="m-alpha-01">&alpha; 0.1</label>
                            </div>
                            <div class="ttest-settings">
                                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="m-absolute"><label class="form-check-label" for="m-absolute">Absolute differences</label></div>
                                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="m-yeojohnson"><label class="form-check-label" for="m-yeojohnson">Yeo-Johnson transformation</label></div>
                                <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="m-zeromean"><label class="form-check-label" for="m-zeromean">Zero mean</label></div>
                                <div class="settings-notes" id="m-notes"></div>
                            </div>
                            </div>
                            <hr>
                            <div class="row gx-3">
                                <div class="col-6"><button class="btn btn-gold w-100" type="submit" id="m-process"><i class="os-icon icon-play"></i> Analyze</button></div>
                                <div class="col-6"><button class="btn btn-outline-gold w-100" type="button" id="m-clear"><i class="os-icon icon-eraser"></i> Clear</button></div>
                            </div>
                        </form>
                    </div>
                    <div class="app-results">
                        <div id="m-results" hidden>
                            <div class="panel">
                                <div class="main-section-label">Summary</div>
                                <div class="summary-row">
                                    <div class="summary-side">
                                        <div class="stat-tiles" id="m-summary"></div>
                                        <div class="stat-run" id="m-run"></div>
                                    </div>
                                    <!-- the histogram fills this box, which is as tall as the tiles beside it -->
                                    <div class="plot-box"><div id="m-histogram" class="plot-histogram" data-filename="osteosort-p-values"></div></div>
                                </div>
                            </div>
                            <div class="panel">
                                <div class="main-section-label">Results</div>
                                <ul class="nav nav-tabs results-tabs" role="tablist">
                                    <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#m-pane-not_excluded" type="button">Not excluded</button></li>
                                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#m-pane-excluded" type="button">Excluded</button></li>
                                    <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#m-pane-rejected" type="button">Rejected</button></li>
                                </ul>
                                <div class="tab-content">
                                    <div class="tab-pane show active" id="m-pane-not_excluded"></div>
                                    <div class="tab-pane" id="m-pane-excluded"></div>
                                    <div class="tab-pane" id="m-pane-rejected"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal" id="progress-modal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog"><div class="modal-content">
            <div class="modal-header"><h4 class="modal-title">Analyzing...</h4></div>
            <div class="modal-body">
                <div class="progress"><div class="progress-bar progress-bar-striped progress-bar-animated" id="progress-bar" role="progressbar" style="width: 0%"></div></div>
                <p class="progress-text" id="progress-text">Starting...</p>
            </div>
        </div></div>
    </div>

    <div class="modal fade" id="error-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered"><div class="modal-content error-dialog">
            <div class="modal-body">
                <p id="error-text"></p>
                <button type="button" class="btn btn-gold" data-bs-dismiss="modal">Dismiss</button>
            </div>
        </div></div>
    </div>

    <div class="modal fade" id="image-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content">
            <form id="image-form" autocomplete="off">
                <div class="modal-header"><h4 class="modal-title">Save plot</h4></div>
                <div class="modal-body">
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label" for="image-width">Width (px)</label>
                            <input class="form-control" type="number" id="image-width" min="100" max="8000" step="1" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="image-height">Height (px)</label>
                            <input class="form-control" type="number" id="image-height" min="100" max="8000" step="1" required>
                        </div>
                    </div>
                    <label class="form-label mt-2" for="image-format">Format</label>
                    <select class="form-select" id="image-format">
                        <option value="png">PNG</option>
                        <option value="svg">SVG</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-gold">Save</button>
                </div>
            </form>
        </div></div>
    </div>

    <script src="vendor/bootstrap.bundle.min.js"></script>
    <script src="vendor/tom-select.complete.min.js"></script>
    <script src="vendor/papaparse.min.js"></script>
    <script src="vendor/plotly-cartesian.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
