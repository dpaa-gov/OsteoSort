name: Release

# Publishing a GitHub Release (e.g. v2.0.0) compiles the Julia side of
# OsteoSort in both of its builds and attaches them to that release: the
# trimmed one, osteosort-trim-linux-x86_64.tar.gz, which the Dockerfile
# downloads so that Atlas never compiles Julia, and the ordinary one,
# osteosort-linux-x86_64.tar.gz, to fall back on.

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check versions match this release
        run: |
          expected="ARG OSTEOSORT_VERSION=${GITHUB_REF_NAME}"
          if ! grep -qx "$expected" Dockerfile; then
            echo "::error::Dockerfile must contain '$expected' before releasing"
            exit 1
          fi
          expected="${GITHUB_REF_NAME#v}"
          if [[ "$(head -n 1 VERSION | tr -d '[:space:]')" != "$expected" ]]; then
            echo "::error::VERSION must be '$expected' before releasing"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Compile the trimmed build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          build-args: TRIM=1
          platforms: linux/amd64
          outputs: type=local,dest=dist/trim

      - name: Compile the ordinary build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64
          outputs: type=local,dest=dist/julia

      - name: Package
        run: |
          tar -czf dist/osteosort-trim-linux-x86_64.tar.gz -C dist/trim osteosort
          tar -czf dist/osteosort-linux-x86_64.tar.gz -C dist/julia osteosort
          cd dist
          sha256sum osteosort-trim-linux-x86_64.tar.gz > osteosort-trim-linux-x86_64.tar.gz.sha256
          sha256sum osteosort-linux-x86_64.tar.gz > osteosort-linux-x86_64.tar.gz.sha256

      - name: Smoke test the images Atlas would build
        run: |
          dev/smoke.sh dist/osteosort-trim-linux-x86_64.tar.gz
          dev/smoke.sh dist/osteosort-linux-x86_64.tar.gz

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/osteosort-trim-linux-x86_64.tar.gz \
            dist/osteosort-trim-linux-x86_64.tar.gz.sha256 \
            dist/osteosort-linux-x86_64.tar.gz \
            dist/osteosort-linux-x86_64.tar.gz.sha256 \
            --clobber
